<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redipe</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Della+Respira&family=Montserrat:wght@300;400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="mosaic-strip">
            <span style="background: #e63946"></span>
            <span style="background: #f4a261"></span>
            <span style="background: #e9c46a"></span>
            <span style="background: #2a9d8f"></span>
            <span style="background: #457b9d"></span>
            <span style="background: #6a4c93"></span>
            <span style="background: #ff595e"></span>
            <span style="background: #ffca3a"></span>
            <span style="background: #8ac926"></span>
            <span style="background: #1982c4"></span>
            <span style="background: #c8902d"></span>
            <span style="background: #e63946"></span>
            <span style="background: #f4a261"></span>
            <span style="background: #2a9d8f"></span>
            <span style="background: #6a4c93"></span>
            <span style="background: #ffca3a"></span>
            <span style="background: #8ac926"></span>
            <span style="background: #457b9d"></span>
            <span style="background: #ff595e"></span>
            <span style="background: #c8902d"></span>
        </div>

        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <span class="sidebar-label">Saved</span>
                <button class="drawer-close" id="drawerClose" aria-label="Close"
                    >✕</button
                >
            </div>
            <ul class="history-list" id="historyList">
                <li><span class="sidebar-empty">None yet</span></li>
            </ul>
        </div>
        <div class="drawer-backdrop" id="drawerBackdrop"></div>

        <div class="guide-backdrop" id="guideBackdrop">
            <div
                class="guide-modal"
                id="guideModal"
                role="dialog"
                aria-modal="true"
                aria-label="Ingredient Guide">
                <div class="guide-modal-header">
                    <span class="guide-modal-title">Ingredient Guide</span>
                    <button
                        class="guide-modal-close"
                        id="guideClose"
                        aria-label="Close"
                        >&#x2715;</button
                    >
                </div>
                <div class="guide-modal-body" id="guideModalBody"></div>
            </div>
        </div>

        <header style="padding-top: 3rem">
            <h1>Redipe</h1>
            <button
                class="drawer-toggle"
                id="drawerToggle"
                aria-label="Saved recipes">
                <svg
                    width="16"
                    height="12"
                    viewBox="0 0 16 12"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <rect
                        width="16"
                        height="1.5"
                        rx="0.75"
                        fill="currentColor" />
                    <rect
                        y="5.25"
                        width="16"
                        height="1.5"
                        rx="0.75"
                        fill="currentColor" />
                    <rect
                        y="10.5"
                        width="16"
                        height="1.5"
                        rx="0.75"
                        fill="currentColor" />
                </svg>
                Saved
            </button>
        </header>

        <form class="url-form" id="scrapeForm">
            <input
                type="url"
                id="urlInput"
                placeholder="Paste a recipe URL…"
                value="https://twokooksinthekitchen.com/maple-balsamic-rainbow-trout/"
                required />
            <button type="submit" id="scrapeBtn">Extract</button>
        </form>

        <div id="status"></div>

        <div class="layout">
            <main>
                <div id="recipe"></div>
                <div class="empty" id="empty">
                    Paste a recipe URL above and press <strong>Extract</strong>.
                </div>
            </main>
        </div>

        <div id="ingPanel">
            <button
                class="ing-panel-tab"
                id="ingPanelTab"
                onclick="toggleIngPanel()"
                aria-label="Toggle ingredients panel">
                <span class="ing-panel-tab-label">Ingredients</span>
                <svg
                    class="tab-chevron"
                    width="7"
                    height="12"
                    viewBox="0 0 7 12"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M5.5 1.5L1.5 6L5.5 10.5"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <div class="ing-panel-inner">
                <div class="ing-panel-head" id="ingPanelHead"></div>
                <div id="ingPanelBody"></div>
            </div>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
