<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Nobs</title>

        <!-- PWA / iOS home screen -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" href="/icon.svg" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Nobs" />
        <meta name="theme-color" content="#c8902d" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Della+Respira&family=Montserrat:wght@300;400;500;600;700&display=swap"
            rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            amber: '#c8902d',
                            parchment: '#faf6ef',
                        },
                        fontFamily: {
                            body: ['Montserrat', 'system-ui', 'sans-serif'],
                            display: ['Della Respira', 'Georgia', 'serif'],
                        },
                    },
                },
            };
        </script>
        <link rel="stylesheet" href="/style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer" />
    </head>
    <body
        class="font-body bg-parchment text-[#111] text-[17px] leading-relaxed">
        <!-- Saved recipes drawer -->
        <div
            id="drawer"
            class="fixed top-0 left-0 bottom-0 w-64 bg-parchment z-[300] px-6 py-8 -translate-x-full transition-transform duration-300 overflow-y-auto border-r border-[#e2d8cc]">
            <div class="flex items-baseline justify-between mb-5">
                <span
                    class="text-[0.65rem] font-bold tracking-[0.14em] uppercase text-[#8a7d72]"
                    >Saved</span
                >
                <button
                    id="drawerClose"
                    aria-label="Close"
                    class="text-base text-[#8a7d72] hover:text-[#111] leading-none bg-transparent border-0 cursor-pointer"
                    >✕</button
                >
            </div>
            <ul class="history-list" id="historyList">
                <li><span class="text-sm text-[#8a7d72]">None yet</span></li>
            </ul>
        </div>
        <div
            id="drawerBackdrop"
            class="hidden fixed inset-0 bg-black/25 z-[200]"></div>

        <!-- Ingredient guide modal -->
        <div
            id="guideBackdrop"
            class="hidden fixed inset-0 bg-black/45 z-[400] items-center justify-center p-8">
            <div
                id="guideModal"
                class="bg-parchment rounded-md max-w-xl w-full max-h-[80vh] flex flex-col shadow-[0_8px_40px_rgba(0,0,0,0.18)]"
                role="dialog"
                aria-modal="true"
                aria-label="Ingredient Guide">
                <div
                    class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-[#e2d8cc] shrink-0">
                    <span
                        class="text-[0.65rem] font-bold tracking-[0.14em] uppercase text-[#8a7d72]"
                        >Ingredient Guide</span
                    >
                    <button
                        id="guideClose"
                        aria-label="Close"
                        class="text-base text-[#8a7d72] hover:text-[#111] leading-none bg-transparent border-0 cursor-pointer"
                        >&#x2715;</button
                    >
                </div>
                <div
                    id="guideModalBody"
                    class="overflow-y-auto px-6 py-4 [scrollbar-width:thin]"></div>
            </div>
        </div>

        <!-- Header -->
        <div id="app-scroll">
            <!-- Mosaic strip -->
            <div class="mosaic-strip">
                <span style="background: #e63946"></span>
                <span style="background: #f4a261"></span>
                <span style="background: #e9c46a"></span>
                <span style="background: #2a9d8f"></span>
                <span style="background: #457b9d"></span>
                <span style="background: #6a4c93"></span>
                <span style="background: #ff595e"></span>
                <span style="background: #ffca3a"></span>
                <span style="background: #8ac926"></span>
                <span style="background: #1982c4"></span>
                <span style="background: #c8902d"></span>
                <span style="background: #e63946"></span>
                <span style="background: #f4a261"></span>
                <span style="background: #2a9d8f"></span>
                <span style="background: #6a4c93"></span>
                <span style="background: #ffca3a"></span>
                <span style="background: #8ac926"></span>
                <span style="background: #457b9d"></span>
                <span style="background: #ff595e"></span>
                <span style="background: #c8902d"></span>
            </div>
            <header
                class="max-w-[1080px] mx-auto mt-8 mb-8 flex items-center gap-4">
                <a
                    href="/"
                    id="homeBtn"
                    aria-label="Home"
                    class="flex items-center justify-center w-9 h-9 bg-amber rounded-[8px] text-white no-underline font-display text-xl leading-none select-none mr-2"
                    >N</a
                >
                <button
                    id="drawerToggle"
                    aria-label="Saved recipes"
                    class="flex items-center gap-[0.45rem] bg-transparent border-0 font-body text-[0.75rem] font-bold tracking-[0.1em] uppercase text-[#8a7d72] hover:text-[#111] cursor-pointer transition-colors duration-150">
                    <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
                        <rect
                            width="16"
                            height="1.5"
                            rx="0.75"
                            fill="currentColor" />
                        <rect
                            y="5.25"
                            width="16"
                            height="1.5"
                            rx="0.75"
                            fill="currentColor" />
                        <rect
                            y="10.5"
                            width="16"
                            height="1.5"
                            rx="0.75"
                            fill="currentColor" />
                    </svg>
                    Saved
                </button>
                <button
                    id="newBtn"
                    aria-label="Add recipe"
                    class="flex items-center gap-[0.45rem] bg-transparent border-0 font-body text-[0.75rem] font-bold tracking-[0.1em] uppercase text-[#8a7d72] hover:text-[#111] cursor-pointer transition-colors duration-150">
                    <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                        <path
                            d="M5.5 1v9M1 5.5h9"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round" />
                    </svg>
                    New
                </button>
            </header>

            <!-- New recipe view -->
            <div id="newView" class="hidden max-w-[560px] mx-auto mt-20 px-2">
                <h2
                    class="font-display text-5xl font-normal text-[#111] mb-2 leading-tight"
                    >Add a Recipe</h2
                >
                <!-- Mode toggle -->
                <div class="flex gap-4 mb-8">
                    <button
                        id="modeUrl"
                        onclick="setInputMode('url')"
                        class="font-body text-[0.75rem] font-bold tracking-[0.1em] uppercase border-0 bg-transparent cursor-pointer pb-[2px] transition-colors duration-150 text-[#111] border-b-2 border-[#111]">
                        URL
                    </button>
                    <button
                        id="modePaste"
                        onclick="setInputMode('paste')"
                        class="font-body text-[0.75rem] font-bold tracking-[0.1em] uppercase border-0 bg-transparent cursor-pointer pb-[2px] transition-colors duration-150 text-[#8a7d72] border-b-2 border-transparent">
                        Paste Text
                    </button>
                </div>
                <!-- URL form -->
                <form
                    id="scrapeForm"
                    class="flex gap-0 border-b-[1.5px] border-[#111] pb-2 mb-3">
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="https://…"
                        class="flex-1 bg-transparent border-0 outline-none text-[1rem] text-[#111] font-body placeholder-[#8a7d72]" />
                    <button
                        type="submit"
                        id="scrapeBtn"
                        class="bg-amber border-0 rounded-full text-[0.75rem] font-bold tracking-[0.08em] uppercase cursor-pointer text-white px-[1.1rem] py-[0.4rem] whitespace-nowrap transition-opacity duration-150 hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed font-body shrink-0">
                        Add
                    </button>
                </form>
                <!-- Paste text form -->
                <form id="pasteForm" class="hidden mb-3">
                    <textarea
                        id="pasteInput"
                        placeholder="Paste recipe text here…"
                        rows="8"
                        class="w-full bg-transparent border border-[#e2d8cc] rounded outline-none text-[0.9rem] text-[#111] font-body placeholder-[#8a7d72] p-3 resize-y mb-2 focus:border-[#111] transition-colors"></textarea>
                    <button
                        type="submit"
                        id="pasteScrapeBtn"
                        class="bg-amber border-0 rounded-full text-[0.75rem] font-bold tracking-[0.08em] uppercase cursor-pointer text-white px-[1.1rem] py-[0.4rem] whitespace-nowrap transition-opacity duration-150 hover:opacity-80 font-body">
                        Extract
                    </button>
                </form>
                <div
                    id="status"
                    class="text-[0.78rem] text-[#555] min-h-[1.2em] tracking-[0.02em]"></div>
                <ul
                    id="scrapeQueue"
                    class="mt-4 space-y-0 list-none p-0 text-[0.82rem]"></ul>
            </div>

            <!-- Dashboard view -->
            <div id="dashView" class="hidden max-w-[1080px] mx-auto mt-8 px-2">
                <!-- Filter bar -->
                <div id="dashFilters" class="mb-6">
                    <!-- Search + count/clear row -->
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <div
                            class="flex items-center gap-1 border-b border-[#111] pb-[3px] min-w-[200px] max-w-xs">
                            <i
                                class="fa-solid fa-magnifying-glass text-[#8a7d72] text-[0.75rem]"></i>
                            <input
                                id="ingredientSearch"
                                type="text"
                                placeholder="Search recipes or ingredients…"
                                class="bg-transparent border-0 outline-none text-[0.82rem] text-[#111] font-body placeholder-[#8a7d72] w-full"
                                oninput="onIngredientInput(event)"
                                onkeydown="onIngredientKeydown(event)" />
                        </div>
                        <div
                            id="ingredientChips"
                            class="flex flex-wrap gap-1"></div>
                        <span id="dashCount" class="text-[0.72rem] text-[#8a7d72] font-body ml-auto"></span>
                        <button id="clearFiltersBtn" onclick="clearAllFilters()" class="hidden text-[0.72rem] font-body font-semibold tracking-wide text-[#8a7d72] border-0 bg-transparent cursor-pointer hover:text-[#111] transition-colors">Clear filters</button>
                    </div>
                    <!-- Tag filter rows -->
                    <div
                        id="mealTypeFilters"
                        class="flex flex-wrap gap-1 mb-2"></div>
                    <div class="flex flex-wrap gap-1 mb-2">
                        <button
                            onclick="toggleFilter('dietary', 'vegetarian')"
                            data-filter="dietary:vegetarian"
                            class="filter-chip"
                            >Vegetarian</button
                        >
                        <button
                            onclick="toggleFilter('dietary', 'vegan')"
                            data-filter="dietary:vegan"
                            class="filter-chip"
                            >Vegan</button
                        >
                        <button
                            onclick="toggleFilter('dietary', 'gluten-free')"
                            data-filter="dietary:gluten-free"
                            class="filter-chip"
                            >Gluten-free</button
                        >
                        <button
                            onclick="toggleFilter('dietary', 'dairy-free')"
                            data-filter="dietary:dairy-free"
                            class="filter-chip"
                            >Dairy-free</button
                        >
                        <button
                            onclick="toggleFilter('dietary', 'nut-free')"
                            data-filter="dietary:nut-free"
                            class="filter-chip"
                            >Nut-free</button
                        >
                        <button
                            onclick="toggleFilter('dietary', 'low-carb')"
                            data-filter="dietary:low-carb"
                            class="filter-chip"
                            >Low-carb</button
                        >
                    </div>
                    <div class="flex flex-wrap gap-1">
                        <button
                            onclick="toggleFilter('season', 'spring')"
                            data-filter="season:spring"
                            class="filter-chip"
                            >Spring</button
                        >
                        <button
                            onclick="toggleFilter('season', 'summer')"
                            data-filter="season:summer"
                            class="filter-chip"
                            >Summer</button
                        >
                        <button
                            onclick="toggleFilter('season', 'autumn')"
                            data-filter="season:autumn"
                            class="filter-chip"
                            >Autumn</button
                        >
                        <button
                            onclick="toggleFilter('season', 'winter')"
                            data-filter="season:winter"
                            class="filter-chip"
                            >Winter</button
                        >
                    </div>
                </div>
                <div id="dashGrid" class="dash-grid"></div>
            </div>

            <!-- Recipe / empty view -->
            <div id="recipeLayout" class="max-w-[1080px] mx-auto mt-8">
                <main>
                    <div id="recipe" class="hidden min-w-0"></div>
                    <div id="empty" class="py-16 text-[#8a7d72] text-[0.88rem]">
                        Tap <strong>+ New</strong> to add your first recipe.
                    </div>
                </main>
            </div> </div
        ><!-- end #app-scroll -->

        <!-- Ingredients panel (desktop: right slide-in, mobile: bottom sheet) -->
        <div id="ingPanel">
            <!-- 3 outer tabs — open/close panel AND switch tab -->
            <div class="ing-outer-tabs">
                <button
                    class="ing-outer-tab active"
                    id="otab-ingredients"
                    onclick="tapOuterTab('ingredients')"
                    aria-label="Ingredients"
                    ><i class="fa-solid fa-utensils"></i
                ></button>
                <button
                    class="ing-outer-tab"
                    id="otab-timers"
                    onclick="tapOuterTab('timers')"
                    aria-label="Timers"
                    ><i class="fa-solid fa-stopwatch"></i
                ></button>
                <button
                    class="ing-outer-tab"
                    id="otab-servings"
                    onclick="tapOuterTab('servings')"
                    aria-label="Servings"
                    ><i class="fa-solid fa-users"></i
                ></button>
            </div>
            <!-- Ingredients section -->
            <div class="panel-section" id="panelIngredients">
                <div class="ing-panel-inner">
                    <div class="ing-panel-head" id="ingPanelHead"></div>
                    <div id="ingPanelBody"></div>
                </div>
            </div>
            <!-- Timers section -->
            <div class="panel-section" id="panelTimers" style="display: none">
                <div class="ing-panel-inner">
                    <p class="panel-empty-hint" id="timerEmptyHint"
                        >Tap ⏱ on a step to start a timer.</p
                    >
                    <div id="timersList"></div>
                </div>
            </div>
            <!-- Servings section -->
            <div class="panel-section" id="panelServings" style="display: none">
                <div class="ing-panel-inner">
                    <div id="servingsSection"></div>
                </div>
            </div>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
