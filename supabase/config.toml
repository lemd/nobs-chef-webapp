project_id = "redipe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://nobs.mcdon.co"
additional_redirect_urls = ["https://nobs.mcdon.co/**", "https://nobs.mcdon.co", "http://localhost:5173/**", "http://localhost:5174/**", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://vcsuynfbykvncenmhjfh.supabase.co/auth/v1/callback"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

# JWT verification is disabled so the static front-end can call these
# functions without credentials. Lock this down with RLS + anon key if
# you ever make the project public.
[functions.scrape]
verify_jwt = false

[functions.recipes]
verify_jwt = false

[functions.recipe]
verify_jwt = false

[functions.book]
verify_jwt = false

[functions.invite]
verify_jwt = false
